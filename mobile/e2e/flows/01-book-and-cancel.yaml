# Signed out → browse → sign in (staging test account) → reserve → confirmation → cancel.
appId: app.courtbook.mobile.staging
---
- clearState
- launchApp
- extendedWaitUntil: { visible: "Book a court in Lebanon", timeout: 30000 }
- assertVisible: "STAGING"
- takeScreenshot: shots/01-home-signed-out
- tapOn: "Courts"
- extendedWaitUntil: { visible: ".*Demo club.*", timeout: 30000 }
- takeScreenshot: shots/02-courts
- openLink: "courtbook-staging://club/${E2E_CLUB}?date=${E2E_DATE}"
- extendedWaitUntil: { visible: { id: "time-1[0-9]:00" }, timeout: 30000 }
- tapOn: { id: "time-1[0-9]:00", index: 0 }
- extendedWaitUntil: { visible: "Sign in to reserve", timeout: 20000 }
- takeScreenshot: shots/03-selected-signed-out
- tapOn: "Sign in to reserve"
- scrollUntilVisible: { element: { id: "staging-email" } }
- tapOn: { id: "staging-email" }
- inputText: "${E2E_EMAIL}"
- tapOn: { id: "staging-password" }
- inputText: "${E2E_PASSWORD}"
- hideKeyboard
- tapOn: { id: "staging-sign-in" }
- extendedWaitUntil: { visible: "Reserve court", timeout: 30000 }
- takeScreenshot: shots/04-ready
- tapOn: "Reserve court"
- extendedWaitUntil: { visible: "Court booked", timeout: 60000 }
- takeScreenshot: shots/05-booked
- scrollUntilVisible: { element: "Cancel booking" }
- tapOn: "Cancel booking"
- tapOn: "Yes, cancel"
- extendedWaitUntil: { visible: ".*[Cc]ancelled.*", timeout: 30000 }
- takeScreenshot: shots/06-cancelled
