# Continues from large-text-unresolved.yaml, the same way as flow 02: test tool off, go Home, press
# "Check now" if the app has not already looked again on its own, recover the same booking, look at
# its ticket at this text size, cancel it.
appId: app.courtbook.mobile.staging
---
- openLink: "courtbook-staging://profile"
- scrollUntilVisible: { element: "Off" }
- tapOn: "Off"
- openLink: "courtbook-staging://"
- runFlow:
    when:
      visible: "Check now"
    commands:
      - tapOn: "Check now"
- extendedWaitUntil: { visible: "Your booking went through", timeout: 60000 }
- tapOn: "View booking"
- extendedWaitUntil: { visible: { id: "ticket-start" }, timeout: 30000 }
- takeScreenshot: shots/sizes/ticket-recovered-${SUFFIX}
# "Visible" can mean behind Android's navigation bar (the app draws under it); the page keeps room
# at the bottom, so one more scroll brings the last button fully above the bar before tapping it.
- scrollUntilVisible: { element: "Cancel booking" }
- scroll
- tapOn: "Cancel booking"
- tapOn: "Yes, cancel"
- extendedWaitUntil: { visible: ".*[Cc]ancelled.*", timeout: 30000 }
