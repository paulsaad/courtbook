# One screenshot of each main screen, for the current display size and text size (SUFFIX).
# Screenshots are the point here; a step that can't be reached is skipped, not a failure.
appId: app.courtbook.mobile.staging
---
- launchApp
- runFlow: _dismiss-anr.yaml
- extendedWaitUntil: { visible: "Book a court", timeout: 120000 }
- takeScreenshot: shots/sizes/home-${SUFFIX}
- tapOn: "Courts"
- extendedWaitUntil: { visible: "All sports", timeout: 20000, optional: true }
- takeScreenshot: shots/sizes/courts-${SUFFIX}
- openLink: "courtbook-staging://club/${E2E_CLUB}?date=${E2E_DATE}"
- extendedWaitUntil: { visible: { id: "time-.*" }, timeout: 30000, optional: true }
- takeScreenshot: shots/sizes/club-book-${SUFFIX}
# On a narrow phone with large text the times start below the fold; without this scroll the tap
# was skipped and no size screenshot ever showed a selected time (missed finding F4, 18 Nov).
- scrollUntilVisible: { element: { id: "time-.*" }, direction: DOWN, timeout: 20000, optional: true }
- tapOn: { id: "time-.*", index: 0, optional: true }
- takeScreenshot: shots/sizes/club-selected-${SUFFIX}
- tapOn: { text: "Info", optional: true }
- takeScreenshot: shots/sizes/club-info-${SUFFIX}
- back
- tapOn: { text: "Bookings", optional: true }
- takeScreenshot: shots/sizes/bookings-${SUFFIX}
- tapOn: { text: "Profile", optional: true }
- takeScreenshot: shots/sizes/profile-${SUFFIX}
