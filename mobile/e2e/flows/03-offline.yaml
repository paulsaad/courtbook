# Offline at the moment of reserving: nothing is sent, and the player is told so.
appId: app.courtbook.mobile.staging
---
- launchApp
- openLink: "courtbook-staging://club/${E2E_CLUB}?date=${E2E_DATE}"
- extendedWaitUntil: { visible: { id: "time-1[0-9]:00" }, timeout: 30000 }
- tapOn: { id: "time-1[0-9]:00", index: 0 }
- extendedWaitUntil: { visible: "Reserve court", timeout: 20000 }
- setAirplaneMode: enabled
- extendedWaitUntil: { visible: ".*You're offline.*", timeout: 20000 }
- tapOn: "Reserve court"
- extendedWaitUntil: { visible: ".*nothing was sent.*", timeout: 20000 }
- takeScreenshot: shots/10-offline
- setAirplaneMode: disabled
