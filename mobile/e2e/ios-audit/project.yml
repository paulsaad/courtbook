# Apple's own accessibility audit (XCTest performAccessibilityAudit) run against the installed
# CourtBook Staging app on the iOS simulator. The host app is an empty placeholder Xcode needs for a
# UI-test bundle; the tests drive app.courtbook.mobile.staging by its bundle ID.
# Generated with XcodeGen in CI: xcodegen generate
name: CourtBookAudit
options:
  bundleIdPrefix: test.courtbook.audit
  deploymentTarget: { iOS: "17.0" }
targets:
  AuditHost:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGNING_ALLOWED: NO
  AuditUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies: [{ target: AuditHost }]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AuditHost
        CODE_SIGNING_ALLOWED: NO
schemes:
  Audit:
    build: { targets: { AuditHost: all, AuditUITests: [test] } }
    test: { targets: [AuditUITests] }
