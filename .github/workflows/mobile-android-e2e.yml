name: Mobile Android tests (emulator, staging)

# Builds CourtBook Staging for Android on GitHub (no EAS, no store signing: a test build), starts an
# Android emulator, and drives the real app against the STAGING database with Maestro:
#   book and cancel · unresolved reservation recovered by its token · offline
# then screenshots every main screen at two phone sizes and three text sizes, and audits each screen
# for TalkBack. Never touches the live database: the staging settings come from the staging secrets,
# the helper refuses anything else, and the app itself refuses a database that doesn't match it.
on:
  workflow_dispatch:

concurrency:
  group: android-e2e-staging
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    env:
      APP_VARIANT: staging
      E2E_BUILD: "1"
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
      STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Staging settings only
        run: |
          case "$EXPO_PUBLIC_SUPABASE_URL" in
            https://pwznauyioqykdwodwpvx.supabase.co*) echo "staging project: ok" ;;
            *) echo "::error::STAGING_SUPABASE_URL is not the staging project. Nothing was built."; exit 1 ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null

      - run: npm ci
      - run: npm run typecheck && npm test -- --ci

      - name: Build the Android test app (CourtBook Staging, x86_64)
        run: |
          npx expo prebuild --platform android --no-install --clean
          cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon -q
          ls -la app/build/outputs/apk/release/

      - name: Prepare staging (test account, demo club takes payment at the desk)
        run: node e2e/staging.mjs prepare

      - name: Install Maestro
        working-directory: .
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Emulator tests (Android 14, Pixel 6)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: mobile
          script: bash e2e/run-android.sh

      - name: Clean up staging
        if: always()
        run: node e2e/staging.mjs cleanup || true

      - name: Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e
          path: |
            mobile/e2e/out/
            ~/.maestro/tests/
          if-no-files-found: warn
