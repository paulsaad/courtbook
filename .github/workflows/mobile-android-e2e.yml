name: Mobile Android tests (emulator, staging)
# (also the iOS simulator accessibility audit: run with platform = ios)

# Builds CourtBook Staging for Android on GitHub (no EAS, no store signing: a test build), starts an
# Android emulator, and drives the real app against the STAGING database with Maestro:
#   book and cancel · unresolved reservation recovered by its token · offline
# then screenshots every main screen at two phone sizes and three text sizes, and audits each screen
# for TalkBack. Never touches the live database: the staging settings come from the staging secrets,
# the helper refuses anything else, and the app itself refuses a database that doesn't match it.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "android = emulator flows, sizes and TalkBack audit; ios = simulator accessibility audit (Apple's audit, three sizes)"
        type: choice
        options: [android, ios]
        default: android

# One staging-changing run at a time across BOTH workflows that change shared staging data (the demo
# club's payment mode, test accounts): "Staging database" and "Mobile Android tests". A run waits
# for the one in progress. GitHub keeps at most one waiting run per group: a newer one replaces it
# (the replaced run never starts, so it changes nothing). Keep this group name identical in both files.
concurrency:
  group: staging-shared-data
  cancel-in-progress: false

permissions:
  contents: write   # only to publish the screenshots to the e2e-screenshots branch

jobs:
  e2e:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
    env:
      APP_VARIANT: staging
      E2E_BUILD: "1"
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      EXPO_PUBLIC_E2E: "1"
      # Source maps go to Sentry from the test build too, so its test report shows real file names.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_DISABLE_AUTO_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN == '' && 'true' || 'false' }}
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
      STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Staging settings only
        run: |
          case "$EXPO_PUBLIC_SUPABASE_URL" in
            https://pwznauyioqykdwodwpvx.supabase.co*) echo "staging project: ok" ;;
            *) echo "::error::STAGING_SUPABASE_URL is not the staging project. Nothing was built."; exit 1 ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null

      - run: npm ci
      - run: npm run typecheck && npm test -- --ci

      # The test build only depends on the app code; reuse it when nothing but the tests changed.
      - name: Reuse the test build if the app code is unchanged
        id: apk
        uses: actions/cache/restore@v4
        with:
          path: mobile/e2e/app-release.apk
          key: e2e-apk-${{ hashFiles('.github/workflows/mobile-android-e2e.yml', 'mobile/app/**', 'mobile/components/**', 'mobile/lib/**', 'mobile/shared/**', 'mobile/assets/**', 'mobile/package-lock.json', 'mobile/app.json', 'mobile/app.config.ts') }}

      - name: Build the Android test app (CourtBook Staging, x86_64)
        if: steps.apk.outputs.cache-hit != 'true'
        run: |
          npx expo prebuild --platform android --no-install --clean
          cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk ../e2e/app-release.apk

      # Saved straight away, so a later failure in the tests doesn't throw the build away.
      - name: Keep the test build
        if: steps.apk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mobile/e2e/app-release.apk
          key: ${{ steps.apk.outputs.cache-primary-key }}

      - name: Prepare staging (test account, demo club takes payment at the desk)
        run: node e2e/staging.mjs prepare

      - name: Install Maestro
        working-directory: .
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Emulator tests (Android 12, Pixel 6)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: mobile
          script: bash e2e/run-android.sh

      - name: Clean up staging
        if: always()
        run: node e2e/staging.mjs cleanup || true

      # Screenshots also go to a branch of their own (replaced each run), so they can be looked at
      # without downloading the artifact. Nothing else is committed.
      - name: Publish screenshots to the e2e-screenshots branch
        if: always()
        working-directory: .
        run: |
          [ -d mobile/e2e/out ] || exit 0
          mkdir -p /tmp/shots && find mobile/e2e/out ~/.maestro/tests -name '*.png' -exec cp --backup=numbered {} /tmp/shots/ \; 2>/dev/null || true
          cp mobile/e2e/out/a11y.txt /tmp/shots/ 2>/dev/null || true
          cd /tmp/shots && git init -q && git checkout -q -b e2e-screenshots
          git -c user.name=e2e -c user.email=e2e@courtbook.test add -A
          git -c user.name=e2e -c user.email=e2e@courtbook.test commit -q -m "Android test screenshots, run ${{ github.run_id }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" e2e-screenshots

      - name: Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e
          path: |
            mobile/e2e/out/
            ~/.maestro/tests/
          if-no-files-found: warn

  ios-a11y:
    if: inputs.platform == 'ios'
    runs-on: macos-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: mobile
    env:
      APP_VARIANT: staging
      E2E_BUILD: "1"
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}
      EXPO_PUBLIC_E2E: "1"
      SENTRY_DISABLE_AUTO_UPLOAD: "true"   # no crash reporting in this build (no DSN), so no upload
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
      STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Staging settings only
        run: |
          case "$EXPO_PUBLIC_SUPABASE_URL" in
            https://pwznauyioqykdwodwpvx.supabase.co*) echo "staging project: ok" ;;
            *) echo "::error::STAGING_SUPABASE_URL is not the staging project. Nothing was built."; exit 1 ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Tools (psql for the staging helper, XcodeGen for the audit project)
        run: |
          brew install -q libpq xcodegen
          echo "$(brew --prefix libpq)/bin" >> "$GITHUB_PATH"
          xcodebuild -version

      - run: npm ci

      - name: Reuse the simulator build if the app code is unchanged
        id: app
        uses: actions/cache/restore@v4
        with:
          path: mobile/e2e/CourtBookStaging.app
          key: e2e-ios-app-${{ hashFiles('.github/workflows/mobile-android-e2e.yml', 'mobile/app/**', 'mobile/components/**', 'mobile/lib/**', 'mobile/shared/**', 'mobile/assets/**', 'mobile/package-lock.json', 'mobile/app.json', 'mobile/app.config.ts') }}

      - name: Build CourtBook Staging for the iOS simulator (Release, unsigned)
        if: steps.app.outputs.cache-hit != 'true'
        run: |
          npx expo prebuild --platform ios --clean
          ws=$(ls -d ios/*.xcworkspace | head -1)
          scheme=$(basename "$ws" .xcworkspace)   # the app's own scheme has the workspace's name
          echo "workspace $ws, scheme $scheme"
          xcodebuild -workspace "$ws" -scheme "$scheme" -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= -quiet build
          rm -rf e2e/CourtBookStaging.app
          cp -R "$(ls -d ios/build/Build/Products/Release-iphonesimulator/*.app | head -1)" e2e/CourtBookStaging.app
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" e2e/CourtBookStaging.app/Info.plist
          codesign -d --entitlements - e2e/CourtBookStaging.app 2>&1 | head -20

      - name: Keep the simulator build
        if: steps.app.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mobile/e2e/CourtBookStaging.app
          key: ${{ steps.app.outputs.cache-primary-key }}

      - name: Prepare staging (test account, demo club takes payment at the desk)
        run: node e2e/staging.mjs prepare

      - name: Accessibility audit (Apple's audit on the iOS simulator)
        timeout-minutes: 75
        run: bash e2e/run-ios.sh

      - name: Clean up staging
        if: always()
        run: node e2e/staging.mjs cleanup || true

      - name: Publish screenshots and audit to the e2e-screenshots-ios branch
        if: always()
        working-directory: .
        run: |
          [ -d mobile/e2e/out ] || exit 0
          mkdir -p /tmp/shots && cp mobile/e2e/out/*.png mobile/e2e/out/ios-audit-*.txt /tmp/shots/ 2>/dev/null || true
          cd /tmp/shots && git init -q && git checkout -q -b e2e-screenshots-ios
          git -c user.name=e2e -c user.email=e2e@courtbook.test add -A
          git -c user.name=e2e -c user.email=e2e@courtbook.test commit -q -m "iOS audit, run ${{ github.run_id }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" e2e-screenshots-ios
