name: Database backup (verified)

# A manual backup of one Supabase database, proved restorable before it is kept:
#   1. dump roles, schema and data with the Supabase CLI (Supabase's documented backup method), plus
#      the source's exact permissions as SQL (a new database grants anon / authenticated by default;
#      the dump alone would not take those grants away again);
#   2. count every table (public, auth, storage) and fingerprint the schema on the source, read-only;
#   3. restore the dump into a throwaway local Supabase started on this runner, as Supabase's restore
#      guide does, and take the same counts there — every count and fingerprint must match;
#   4. only then encrypt the dump (AES-256, passphrase from the BACKUP_PASSPHRASE secret) and keep it
#      as a run artifact. Nothing unencrypted leaves the runner; logs show table names and numbers only.
# Nothing is ever written to the source database. `staging` is the rehearsal; `live` needs the
# LIVE_DB_URL secret (Session pooler string of project lgujfbwunokobjxlvpuf).
# A LIVE backup starts only by hand: Actions → "Database backup (verified)" → Run workflow on `main`,
# source = live (GitHub shows that button only once this file is on `main`). Pushing to branch
# `db-backup-staging` runs the staging rehearsal; no push ever backs up live.
#
# Security:
# - LIVE_DB_URL and BACKUP_PASSPHRASE are secrets of the GitHub environment `live-backup` (not repository
#   secrets): only a job of this workflow that names that environment can read them, only from the
#   branch the environment allows (main), and only after Paul approves the run on GitHub (required
#   reviewers work on GitHub Free because this repository is public).
# - Live = a hand-started run on `main` with source = live, nothing else. A push always backs up staging
#   and never names the live environment.
# - The connection string and its password are masked in logs; secrets are given only to the steps that
#   use them; the passphrase goes to gpg on standard input; nothing unencrypted is uploaded.

on:
  push:
    branches: [db-backup-staging]   # staging rehearsal only
  workflow_dispatch:
    inputs:
      source:
        description: "Which database to back up"
        type: choice
        options: [staging, live]
        default: staging
      keep_days:
        description: "How many days GitHub keeps the encrypted file (download it to your own storage too)"
        type: number
        default: 30

concurrency:
  group: db-backup-${{ (github.event_name == 'workflow_dispatch' && inputs.source == 'live') && 'live' || 'staging' }}
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # live only: secrets live in this environment, which requires Paul's approval for every run
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.source == 'live') && 'live-backup' || 'staging-backup' }}
    env:
      SOURCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.source == 'live') && 'live' || 'staging' }}
      LIVE_REF: lgujfbwunokobjxlvpuf
      STAGING_REF: pwznauyioqykdwodwpvx
    steps:
      - uses: actions/checkout@v4

      - name: Which database (refuses a mismatch)
        env:
          LIVE_DB_URL: ${{ secrets.LIVE_DB_URL }}
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ "$SOURCE" = live ]; then
            [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF_NAME" = main ] || { echo "::error::A live backup runs only when started by hand on main."; exit 1; }
            url="$LIVE_DB_URL"; want="$LIVE_REF"
          else
            # a live secret must exist only in the live-backup environment, never as a repository secret
            [ -z "$LIVE_DB_URL" ] || { echo "::error::LIVE_DB_URL is readable outside the live-backup environment (repository secret?). Move it into the environment. Nothing done."; exit 1; }
            url="$STAGING_DB_URL"; want="$STAGING_REF"
          fi
          [ -n "$url" ] || { echo "::error::The ${SOURCE^^}_DB_URL secret is not set."; exit 1; }
          pw=$(echo "$url" | sed -nE 's#^[a-z]+://[^:]+:([^@]+)@.*#\1#p'); [ -n "$pw" ] && echo "::add-mask::$pw"
          echo "::add-mask::$url"
          ref=$(echo "$url" | sed -nE 's#^postgres(ql)?://postgres\.([a-z0-9]+):.*#\2#p')
          [ "$ref" = "$want" ] || { echo "::error::The $SOURCE connection string is for project '$ref', expected '$want'. Nothing done."; exit 1; }
          if [ "$SOURCE" = live ] && [ -z "$PASS" ]; then echo "::error::BACKUP_PASSPHRASE is not set: a live backup is never kept unencrypted."; exit 1; fi
          echo "Backing up: $SOURCE (project $ref)"

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 3.2.0   # pinned: "latest" asks GitHub's API and can hit its rate limit

      - name: Dump roles, schema and data (Supabase CLI)
        env:
          LIVE_DB_URL: ${{ secrets.LIVE_DB_URL }}
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          DB_URL=$([ "$SOURCE" = live ] && echo "$LIVE_DB_URL" || echo "$STAGING_DB_URL")
          mkdir -p /tmp/backup && cd /tmp/backup
          supabase db dump --db-url "$DB_URL" -f roles.sql --role-only
          supabase db dump --db-url "$DB_URL" -f schema.sql
          supabase db dump --db-url "$DB_URL" -f data.sql --use-copy --data-only -x "storage.buckets_vectors" -x "storage.vector_indexes"
          ls -l /tmp/backup | awk 'NR>1 {print $5, $9}'

      - name: Counts and fingerprints on the source (read only)
        env:
          LIVE_DB_URL: ${{ secrets.LIVE_DB_URL }}
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          DB_URL=$([ "$SOURCE" = live ] && echo "$LIVE_DB_URL" || echo "$STAGING_DB_URL")
          sudo apt-get -qq install -y postgresql-client >/dev/null
          PGOPTIONS="-c default_transaction_read_only=on" psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/scripts/db-snapshot.sql > /tmp/source.txt
          PGOPTIONS="-c default_transaction_read_only=on" psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/scripts/db-security-detail.sql > /tmp/source-security.txt
          # the source's exact permissions as SQL, kept in the backup and run last in every restore
          PGOPTIONS="-c default_transaction_read_only=on" psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f .github/scripts/db-security-restore.sql > /tmp/backup/security.sql
          echo "permissions script: $(grep -c '' /tmp/backup/security.sql) statements"
          echo "$(grep -c '^rows ' /tmp/source.txt) tables counted; source Postgres $(grep '^other server major' /tmp/source.txt | cut -d'|' -f2)"

      - name: Start a throwaway local Supabase (Postgres 17)
        run: |
          mkdir -p /tmp/restore && cd /tmp/restore
          supabase init --force >/dev/null
          sed -i 's/^major_version = .*/major_version = 17/' supabase/config.toml
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,mailpit,inbucket,realtime,supavisor,postgres-meta >/dev/null
          echo "local database up"

      - name: Restore the dump into it (Supabase's restore steps)
        run: |
          cd /tmp/backup
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X --single-transaction -v ON_ERROR_STOP=1 \
            -f roles.sql -f schema.sql -c 'SET session_replication_role = replica' -f data.sql \
            -c 'SET session_replication_role = origin' -f security.sql > /tmp/restore.log 2>&1 \
            || { echo "::error::The restore failed (quoted values hidden):"; grep -m5 -E "ERROR|FATAL" /tmp/restore.log | sed -E "s/\"[^\"]*\"/\"…\"/g; s/'[^']*'/'…'/g; s/=\([^)]*\)/=(…)/g" | cut -c1-160; exit 1; }
          echo "restored in one transaction (roles, schema, data, then the source's exact permissions)"

      - name: Compare the restored copy with the source
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f .github/scripts/db-snapshot.sql > /tmp/restored.txt
          # tables that change on their own while the dump runs (sign-in sessions, audit log) are reported, not failed
          volatile='^rows auth\.(sessions|refresh_tokens|audit_log_entries|flow_state|one_time_tokens|mfa_amr_claims|mfa_challenges)\|'
          echo "| check | source | restored |" >> "$GITHUB_STEP_SUMMARY"; echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          fails=0
          export LC_ALL=C
          join -t'|' -a1 -a2 -e MISSING -o 0,1.2,2.2 <(sort -t'|' -k1,1 /tmp/source.txt) <(sort -t'|' -k1,1 /tmp/restored.txt) > /tmp/compare.txt
          while IFS='|' read -r k a b; do
            mark=ok
            if [ "$a" != "$b" ]; then
              if [ "$k" = "other server major version" ] && [ "$b" -ge "$a" ] 2>/dev/null; then mark="newer Postgres on the restore side ($b ≥ $a)"
              elif echo "$k|" | grep -qE "$volatile"; then mark="changed during the dump (sign-in data)"
              elif [ "$a" = MISSING ] && [ "$b" = 0 ] && [ "${k#rows }" != "$k" ]; then mark="empty table that only the newer local platform has"
              else mark=DIFFERENT; fails=$((fails+1)); fi
            fi
            echo "| $k | $a | $b |" >> "$GITHUB_STEP_SUMMARY"
            [ "$mark" = ok ] || echo "$mark: $k source=$a restored=$b"
          done < /tmp/compare.txt
          echo "$(wc -l < /tmp/compare.txt) checks compared, $fails different"
          if [ "$fails" != 0 ]; then
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -v ON_ERROR_STOP=1 -f .github/scripts/db-security-detail.sql > /tmp/restored-security.txt
            echo "Security items only on the source (<) or only on the restored copy (>):"
            diff <(sort /tmp/source-security.txt) <(sort /tmp/restored-security.txt) | grep '^[<>]' | head -80 || true
            echo "::error::The restored copy differs from the source. The backup is NOT kept."; exit 1
          fi
          echo "RESTORE VERIFIED: every row count, data hash (public tables, accounts, storage records), security setting and schema fingerprint matches"

      - name: Encrypt and keep (only after a verified restore)
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          KEEP=yes
          if [ -z "$PASS" ]; then
            [ "$SOURCE" = staging ] || exit 1
            # rehearsal: exercise encryption and the check below with a throwaway key; nothing is kept
            PASS=$(openssl rand -hex 32); echo "::add-mask::$PASS"; KEEP=no
          fi
          name="courtbook-$SOURCE-$(date -u +%Y%m%d-%H%M)"
          cp /tmp/source.txt /tmp/backup/counts.txt
          tar -C /tmp -cf "/tmp/$name.tar" backup
          printf '%s' "$PASS" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 -o "/tmp/$name.tar.gpg" "/tmp/$name.tar"
          rm -f "/tmp/$name.tar"
          # prove the encrypted file opens with the passphrase and holds every part of the backup
          set -o pipefail
          files=$(printf '%s' "$PASS" | gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 0 -d "/tmp/$name.tar.gpg" | tar -t | sort | tr '\n' ' ')
          for f in roles.sql schema.sql data.sql security.sql counts.txt; do
            echo "$files" | grep -q "backup/$f" || { echo "::error::$f is missing from the encrypted file"; exit 1; }
          done
          echo "encrypted file opens with the passphrase and holds: $files"
          echo "KEEP=$KEEP" >> "$GITHUB_ENV"; echo "NAME=$name" >> "$GITHUB_ENV"
          if [ "$KEEP" = yes ]; then
            sha=$(sha256sum "/tmp/$name.tar.gpg" | cut -d' ' -f1)
            echo "Kept: $name.tar.gpg  sha256 $sha"
            echo "" >> "$GITHUB_STEP_SUMMARY"; echo "**Kept:** \`$name.tar.gpg\` · sha256 \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
          else
            rm -f "/tmp/$name.tar.gpg"; echo "Rehearsal: encryption and decryption checked with a throwaway key; nothing kept."
          fi

      - uses: actions/upload-artifact@v4
        if: env.KEEP == 'yes'
        with:
          name: ${{ env.NAME }}
          path: /tmp/${{ env.NAME }}.tar.gpg
          retention-days: ${{ inputs.keep_days || 30 }}
          if-no-files-found: error

      - name: Remove everything unencrypted from the runner
        if: always()
        run: rm -rf /tmp/backup /tmp/source.txt /tmp/restored.txt /tmp/compare.txt /tmp/restore.log /tmp/source-security.txt /tmp/restored-security.txt
