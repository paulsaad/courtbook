# Staging database (decision D2): every migration reaches the staging Supabase project first,
# from here, and the live project only after staging has been verified.
#
# Needs one repository secret, STAGING_DB_URL: the staging project's "Session pooler" connection
# string (Supabase → Connect). GitHub's runners have no IPv6, so the direct db.<ref> address does
# not work from here; the session pooler does.
#
# Safety: the run refuses if the connection string names the live project, and it only ever applies
# files from supabase/migrations of the branch it runs on. It records what it applied in
# staging_meta.applied (staging only), so running it twice never re-applies a file. It applies only the
# migration numbers named in 'migrations' (.github/scripts/staging-plan.sh), so a reserved number such
# as M3's 0067 can never be applied by accident; 'check' lists what is pending and flags any file
# numbered below the highest already applied.
name: Staging database

on:
  workflow_dispatch:
    inputs:
      action:
        description: "check = connect and report; apply = apply migrations not yet applied (+ demo seed); smoke = booking checks in SQL; cancel = cancellation and refund checks in SQL (temporary courts and accounts, removed after); web_accept = launch-1 website flows in a browser against this branch's website built for staging (throwaway accounts, club and court, removed after; needs confirm_ref); api = checks through Supabase's API and the web payment route (throwaway players, cleaned up); tester = Paul's staging-app sign-in (paul.tester@courtbook.test, password from the STAGING_TESTER_PASSWORD secret) and demo club at the desk; demo_at_desk = only the demo club's payment mode back to at the desk (nothing else); m3_0067_preflight / m3_0067_postcheck and m3_0072_preflight / m3_0072_postcheck, m3_0073_*, m3_0074_* and m3_0075_* = read-only checks before / after applying 0067 0072, 0073 or 0074 (supabase/live/00xx_*.sql); blocks_0076_* / blocks_0077_* = read-only checks before / after 0076 or 0077 (calendar blocks); blocks_functional = the block rules tried as a demo-club desk account, in one transaction that is rolled back; m7_0078_* = read-only checks before / after 0078 (hide demo clubs); m7_demo_hidden_on / _off = staging only: set the hide_demo_clubs switch on or off (nothing else); launch1_preflight / launch1_postcheck = read-only checks before / after applying 0078–0084 together (supabase/live/launch1_*.sql); m85_preflight / m85_postcheck = read-only checks before / after applying 0085 (unpublished clubs unreadable); test_conflicts = read only: what occupies the demo courts the smoke/API tests used to book (no player details)"
        type: choice
        options: [check, apply, smoke, cancel, api, web_accept, reset_demo, tester, demo_at_desk, m3_0067_preflight, m3_0067_postcheck, m3_0072_preflight, m3_0072_postcheck, m3_0073_preflight, m3_0073_postcheck, m3_0074_preflight, m3_0074_postcheck, m3_0075_preflight, m3_0075_postcheck, blocks_0076_preflight, blocks_0076_postcheck, blocks_0077_preflight, blocks_0077_postcheck, blocks_functional, m7_0078_preflight, m7_0078_postcheck, m7_demo_hidden_on, m7_demo_hidden_off, launch1_preflight, launch1_postcheck, m85_preflight, m85_postcheck, test_conflicts, m3_accounts, m3_test_games, m3_test_games_shared, m3_test_games_cleanup, m3_moderator_check, m3_moderator_grant]
        default: check
      migrations:
        description: "apply only: the exact migration numbers to apply, e.g. '0068 0069 0070 0071' — nothing else is applied; 'check' lists what is pending"
        type: string
        default: ""
      accounts:
        description: "m3_moderator_grant: one account id (first 8 characters, from m3_accounts). m3_test_games_shared: your account, then the other player (8 characters each). m3_test_games: three account ids (first 8 characters, from m3_accounts): your player, then two other accounts. m3_test_games_cleanup: the recorded game ids (full), so nothing else can be removed"
        type: string
        default: ""
      confirm_ref:
        description: "apply, api and web_accept: the staging project ref, exactly as 'check' reported it"
        type: string
        default: ""

# One staging-changing run at a time across BOTH workflows that change shared staging data (the demo
# club's payment mode, test accounts): "Staging database" and "Mobile Android tests". A run waits
# for the one in progress. GitHub keeps at most one waiting run per group: a newer one replaces it
# (the replaced run never starts, so it changes nothing). Keep this group name identical in both files.
concurrency:
  group: staging-shared-data
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    env:
      DB: ${{ secrets.STAGING_DB_URL }}
      LIVE_REF: lgujfbwunokobjxlvpuf
    steps:
      - uses: actions/checkout@v4

      - name: Refuse anything but staging
        run: |
          if [ -z "$DB" ]; then
            echo "::error::Secret STAGING_DB_URL is not set (Settings → Secrets and variables → Actions)."; exit 1
          fi
          if echo "$DB" | grep -q "$LIVE_REF"; then
            echo "::error::STAGING_DB_URL points at the LIVE project ($LIVE_REF). Nothing was done."; exit 1
          fi
          ref=$(echo "$DB" | sed -nE 's#^postgres(ql)?://postgres\.([a-z0-9]+):.*#\2#p')
          host=$(echo "$DB" | sed -nE 's#.*@([^:/]+).*#\1#p')
          if [ -z "$ref" ]; then
            echo "::error::Could not read a project ref from STAGING_DB_URL (expected the Session pooler form postgresql://postgres.<ref>:...)."; exit 1
          fi
          echo "Branch ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          echo "Target project ref: $ref"
          echo "Target host: $host"
          echo "Live project ref:   $LIVE_REF (refused)"
          echo "REF=$ref" >> "$GITHUB_ENV"

      - name: Connect (read only)
        run: |
          psql "$DB" -v ON_ERROR_STOP=1 -At -F ' ' <<'SQL'
          select 'connected as', current_user, 'to', current_database(), '— PostgreSQL', current_setting('server_version');
          select 'public tables:', count(*) from pg_tables where schemaname = 'public';
          select 'staging marker present:', to_regclass('staging_meta.applied') is not null;
          select 'auth users:', count(*) from auth.users;
          -- The app's "no booking" quiet time (mobile/lib/pendingReservation.ts, QUIET_MS) relies on these.
          select 'role settings:', rolname, coalesce(array_to_string(rolconfig, ', '), '(none)') from pg_roles where rolname in ('authenticated', 'anon', 'authenticator') order by rolname;
          SQL

      - name: Migrations on this branch not yet applied (read only)
        run: |
          if [ "$(psql "$DB" -At -c "select to_regclass('staging_meta.applied') is not null")" = t ]; then
            psql "$DB" -At -c "select name from staging_meta.applied" > /tmp/applied.txt
          else : > /tmp/applied.txt; fi
          echo "Branch ${GITHUB_REF_NAME}: migrations not yet applied on staging:"
          bash .github/scripts/staging-plan.sh pending supabase/migrations /tmp/applied.txt

      - name: Refuse a database that is not ours to initialise
        if: inputs.action == 'apply'
        env:
          CONFIRM: ${{ inputs.confirm_ref }}
        run: |
          if [ "$CONFIRM" != "$REF" ]; then
            echo "::error::confirm_ref '$CONFIRM' does not match the target ref '$REF'. Run 'check' and copy the ref it reports."; exit 1
          fi
          tables=$(psql "$DB" -At -c "select count(*) from pg_tables where schemaname = 'public'")
          marker=$(psql "$DB" -At -c "select to_regclass('staging_meta.applied') is not null")
          # A database with tables we did not put there (for example the live one) is never touched.
          if [ "$tables" != "0" ] && [ "$marker" != "t" ]; then
            echo "::error::Target has $tables public tables and no staging marker: not a fresh staging database. Nothing was done."; exit 1
          fi
          psql "$DB" -v ON_ERROR_STOP=1 -q -c "create schema if not exists staging_meta; create table if not exists staging_meta.applied (name text primary key, applied_at timestamptz not null default now(), sha text); revoke all on schema staging_meta from public, anon, authenticated;"

      - name: Apply exactly the migrations named
        if: inputs.action == 'apply'
        env:
          MIGRATIONS: ${{ inputs.migrations }}
        run: |
          psql "$DB" -At -c "select name from staging_meta.applied" > /tmp/applied.txt
          plan=$(bash .github/scripts/staging-plan.sh apply supabase/migrations /tmp/applied.txt "$MIGRATIONS") \
            || { echo "::error::$plan"; echo "$plan"; exit 1; }
          echo "plan:"; echo "$plan" | sed 's/^/  /'
          # launch-1 (0078–0084): starting it requires the launch-1 preflight to pass; nothing is applied otherwise.
          # Resuming it (0078 already applied) is allowed; anything 0079–0084 without 0078 is refused.
          if echo "$plan" | grep -qE '^00(7[89]|8[0-4])_'; then
            if echo "$plan" | grep -q '^0078_'; then
              echo "launch-1: running the preflight before applying anything"
              bash .github/scripts/run-check.sh "$DB" supabase/live/launch1_preflight.sql part1 \
                || { echo "::error::launch-1 preflight failed: nothing was applied."; exit 1; }
            elif ! grep -q '^0078_' /tmp/applied.txt; then
              echo "::error::0079–0084 need 0078 first (apply them together, starting with 0078)."; exit 1
            fi
          fi
          # 0085 (unpublished clubs unreadable): on its own, after launch-1; its preflight must pass first.
          if echo "$plan" | grep -q '^0085_'; then
            if echo "$plan" | grep -qvE '^0085_'; then echo "::error::apply 0085 on its own (migrations: 0085)."; exit 1; fi
            echo "0085: running the preflight before applying"
            bash .github/scripts/run-check.sh "$DB" supabase/live/0085_preflight.sql part1 \
              || { echo "::error::0085 preflight failed: nothing was applied."; exit 1; }
          fi
          n=0
          for name in $plan; do
            f=supabase/migrations/$name
            echo "applying $name"
            # each file in its own transaction, recorded in the same one (0040 must run alone: it does)
            { cat "$f"; echo; echo "insert into staging_meta.applied (name, sha) values ('$name', '${GITHUB_SHA::7}');"; } \
              | psql "$DB" -v ON_ERROR_STOP=1 -q -1 \
              || { echo "::error::$name failed; it was rolled back and nothing after it was applied."; exit 1; }
            n=$((n+1))
          done
          echo "applied $n migration(s)"
          psql "$DB" -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
          echo "demo seed applied (idempotent)"
          # all seven launch-1 migrations now applied: the postcheck runs here and fails the job if any row is not ok
          if [ "$(psql "$DB" -At -c "select count(*) from staging_meta.applied where name ~ '^00(7[89]|8[0-4])_'")" = 7 ] \
             && echo "$plan" | grep -qE '^00(7[89]|8[0-4])_'; then
            echo "launch-1: all seven applied; running the postcheck"
            bash .github/scripts/run-check.sh "$DB" supabase/live/launch1_postcheck.sql all
          fi
          if echo "$plan" | grep -q '^0085_'; then
            echo "0085: applied; running the postcheck"
            bash .github/scripts/run-check.sh "$DB" supabase/live/0085_postcheck.sql all
          fi

      - name: API credentials are staging's (api)
        if: inputs.action == 'api' || inputs.action == 'web_accept'
        env:
          CONFIRM: ${{ inputs.confirm_ref }}
          S_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          S_ANON: ${{ secrets.STAGING_ANON_KEY }}
          S_SERVICE: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
        run: |
          [ "$CONFIRM" = "$REF" ] || { echo "::error::confirm_ref '$CONFIRM' is not the database's ref '$REF'."; exit 1; }
          for v in S_URL S_ANON S_SERVICE; do [ -n "${!v}" ] || { echo "::error::$v is empty"; exit 1; }; done
          if printf '%s' "$S_URL$S_ANON$S_SERVICE" | grep -q "$LIVE_REF"; then echo "::error::an API secret mentions the LIVE project"; exit 1; fi
          host=$(node -e 'console.log(new URL(process.argv[1].trim()).host)' "$S_URL")
          [ "$host" = "$REF.supabase.co" ] || { echo "::error::STAGING_SUPABASE_URL is $host, expected $REF.supabase.co"; exit 1; }
          echo "API URL host: $host (matches the database's ref $REF)"

      - uses: actions/setup-node@v4
        if: inputs.action == 'api' || inputs.action == 'web_accept'
        with:
          node-version: 22
          cache: npm

      - name: Build this branch's web app against staging (api)
        if: inputs.action == 'api' || inputs.action == 'web_accept'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
        run: |
          npm ci
          npm run build
          nohup npx next start -p 3100 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:3100/ && break; sleep 1; done
          curl -s -o /dev/null -w "web app up: HTTP %{http_code}\n" http://localhost:3100/

      - name: Checks through Supabase's API and the payment route (api)
        if: inputs.action == 'api'
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}
          STAGING_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
          EXPECTED_REF: ${{ inputs.confirm_ref }}
          APP_URL: http://localhost:3100
        run: node supabase/tests/staging_api.mjs

      - name: Website acceptance in a browser (web_accept)
        if: inputs.action == 'web_accept'
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}
          STAGING_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
          EXPECTED_REF: ${{ inputs.confirm_ref }}
          APP_URL: http://localhost:3100
        run: |
          mkdir -p /tmp/tools && (cd /tmp/tools && npm init -y >/dev/null && npm i --no-audit --no-fund puppeteer@23 >/dev/null)
          node supabase/tests/staging_web_accept.mjs

      - name: Website acceptance screenshots (web_accept)
        if: always() && inputs.action == 'web_accept'
        uses: actions/upload-artifact@v4
        with:
          name: web-accept-screens
          path: /tmp/web-accept
          if-no-files-found: ignore
          retention-days: 7

      - name: Web app log (api, on failure)
        if: failure() && (inputs.action == 'api' || inputs.action == 'web_accept')
        run: tail -60 /tmp/next.log || true

      - name: Paul's sign-in for the staging app (tester)
        if: inputs.action == 'tester'
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SERVICE_ROLE_KEY }}
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
          STAGING_TESTER_PASSWORD: ${{ secrets.STAGING_TESTER_PASSWORD }}
        run: node mobile/e2e/staging-tester.mjs

      - name: Put the demo club back to its seeded payment mode (reset_demo)
        if: inputs.action == 'reset_demo'
        run: psql "$DB" -v ON_ERROR_STOP=1 -c "update clubs set payment_mode = 'simulated' where slug = 'batroun' returning name || ' -> ' || payment_mode"

      # One row, one column: the staging demo club's payment mode, back to "at the desk" for phone tests
      # (finding P1, 18 Nov). Refuses unless this is the staging database (marker table) and the club is
      # the demo club; changes no account, booking or setting.
      - name: Demo club at the desk only (demo_at_desk)
        if: inputs.action == 'demo_at_desk'
        run: |
          psql "$DB" -v ON_ERROR_STOP=1 -At <<'SQL'
          do $$ begin
            if to_regclass('staging_meta.applied') is null then raise exception 'not the staging database (no staging marker)'; end if;
          end $$;
          select 'before: ' || name || ' (' || payment_mode || ')' from public.clubs where slug = 'batroun' and is_demo;
          update public.clubs set payment_mode = 'at_desk' where slug = 'batroun' and is_demo returning 'after: ' || name || ' (' || payment_mode || ')';
          SQL

      # M3 0067 (match_detail), the same read-only scripts as on live: preflight once before 'apply' with
      # migrations "0067", postcheck once after. Part 1 / every row must be true; they change nothing.
      - name: 0067 preflight, read only (m3_0067_preflight)
        if: inputs.action == 'm3_0067_preflight'
        run: psql "$DB" -v ON_ERROR_STOP=1 -c "set default_transaction_read_only = on" -f supabase/live/0067_preflight.sql

      - name: 0067 postcheck, read only (m3_0067_postcheck)
        if: inputs.action == 'm3_0067_postcheck'
        run: psql "$DB" -v ON_ERROR_STOP=1 -c "set default_transaction_read_only = on" -f supabase/live/0067_postcheck.sql

      # M3 0072 (game hardening), the same read-only scripts as for live: preflight once before 'apply'
      # with migrations "0072", postcheck once after.
      - name: 0072 preflight, read only (m3_0072_preflight)
        if: inputs.action == 'm3_0072_preflight'
        run: psql "$DB" -v ON_ERROR_STOP=1 -c "set default_transaction_read_only = on" -f supabase/live/0072_preflight.sql

      # Temporary M3 test games for Paul's phone (supabase/staging/m3_test_games.sh): read-only account
      # list with personal addresses hidden; create two "[M3 TEST]" games; remove them again.
      - name: Staging accounts, read only (m3_accounts)
        if: inputs.action == 'm3_accounts'
        run: PGOPTIONS="-c default_transaction_read_only=on" bash supabase/staging/m3_test_games.sh accounts
      - name: Temporary M3 test games (m3_test_games)
        if: inputs.action == 'm3_test_games'
        env:
          ACCOUNTS: ${{ inputs.accounts }}
        run: bash supabase/staging/m3_test_games.sh create $ACCOUNTS
      - name: One shared temporary test game (m3_test_games_shared)
        if: inputs.action == 'm3_test_games_shared'
        env:
          ACCOUNTS: ${{ inputs.accounts }}
        run: bash supabase/staging/m3_test_games.sh shared $ACCOUNTS
      - name: Remove the temporary M3 test games (m3_test_games_cleanup)
        if: inputs.action == 'm3_test_games_cleanup'
        env:
          ACCOUNTS: ${{ inputs.accounts }}
        run: bash supabase/staging/m3_test_games.sh cleanup $ACCOUNTS

      - name: 0072 postcheck, read only (m3_0072_postcheck)
        if: inputs.action == 'm3_0072_postcheck'
        run: psql "$DB" -v ON_ERROR_STOP=1 -c "set default_transaction_read_only = on" -f supabase/live/0072_postcheck.sql

      # M3 0073 (post_match idempotency key): read-only preflight once before 'apply' with migrations "0073", postcheck once after.
      - name: 0073 preflight, read only (m3_0073_preflight)
        if: inputs.action == 'm3_0073_preflight'
        run: psql "$DB" -v ON_ERROR_STOP=1 -c "set default_transaction_read_only = on" -f supabase/live/0073_preflight.sql
      - name: 0073 postcheck, read only (m3_0073_postcheck)
        if: inputs.action == 'm3_0073_postcheck'
        run: psql "$DB" -v ON_ERROR_STOP=1 -c "set default_transaction_read_only = on" -f supabase/live/0073_postcheck.sql

      # M3 0074 (chat and player safety): read-only preflight once before 'apply' with migrations "0074", postcheck once after.
      - name: 0074 preflight, read only (m3_0074_preflight)
        if: inputs.action == 'm3_0074_preflight'
        run: psql "$DB" -v ON_ERROR_STOP=1 -c "set default_transaction_read_only = on" -f supabase/live/0074_preflight.sql
      - name: 0074 postcheck, read only (m3_0074_postcheck)
        if: inputs.action == 'm3_0074_postcheck'
        run: psql "$DB" -v ON_ERROR_STOP=1 -c "set default_transaction_read_only = on" -f supabase/live/0074_postcheck.sql

      # The staging moderator (supabase/staging/m3_moderator.sh): read-only check that the admin accounts can
      # use Admin → Reports and a player cannot; grant = the admin role for ONE named account (approval).
      - name: Staging moderator, read only (m3_moderator_check)
        if: inputs.action == 'm3_moderator_check'
        run: PGOPTIONS="-c default_transaction_read_only=on" bash supabase/staging/m3_moderator.sh check
      - name: Make one account the staging moderator (m3_moderator_grant)
        if: inputs.action == 'm3_moderator_grant'
        env:
          ACCOUNTS: ${{ inputs.accounts }}
        run: bash supabase/staging/m3_moderator.sh grant $ACCOUNTS

      # M3 0075 (moderator history: blocks received): read-only preflight before 'apply' "0075", postcheck after.
      - name: 0075 preflight, read only (m3_0075_preflight)
        if: inputs.action == 'm3_0075_preflight'
        run: psql "$DB" -v ON_ERROR_STOP=1 -c "set default_transaction_read_only = on" -f supabase/live/0075_preflight.sql
      - name: 0075 postcheck, read only (m3_0075_postcheck)
        if: inputs.action == 'm3_0075_postcheck'
        run: psql "$DB" -v ON_ERROR_STOP=1 -c "set default_transaction_read_only = on" -f supabase/live/0075_postcheck.sql

      # Calendar blocks (0076 staff_block, 0077 blocks through functions): read-only preflight before 'apply' "0076"
      # or "0077", postcheck after; blocks_functional tries the rules and rolls everything back.
      - name: 0076 preflight, read only (blocks_0076_preflight)
        if: inputs.action == 'blocks_0076_preflight'
        run: psql "$DB" -v ON_ERROR_STOP=1 -c "set default_transaction_read_only = on" -f supabase/live/0076_preflight.sql
      - name: 0076 postcheck, read only (blocks_0076_postcheck)
        if: inputs.action == 'blocks_0076_postcheck'
        run: psql "$DB" -v ON_ERROR_STOP=1 -c "set default_transaction_read_only = on" -f supabase/live/0076_postcheck.sql
      - name: 0077 preflight, read only (blocks_0077_preflight)
        if: inputs.action == 'blocks_0077_preflight'
        run: psql "$DB" -v ON_ERROR_STOP=1 -c "set default_transaction_read_only = on" -f supabase/live/0077_preflight.sql
      - name: 0077 postcheck, read only (blocks_0077_postcheck)
        if: inputs.action == 'blocks_0077_postcheck'
        run: psql "$DB" -v ON_ERROR_STOP=1 -c "set default_transaction_read_only = on" -f supabase/live/0077_postcheck.sql
      - name: launch-1 preflight, read only (launch1_preflight)
        if: inputs.action == 'launch1_preflight'
        run: bash .github/scripts/run-check.sh "$DB" supabase/live/launch1_preflight.sql part1
      - name: 0085 preflight, read only (m85_preflight)
        if: inputs.action == 'm85_preflight'
        run: bash .github/scripts/run-check.sh "$DB" supabase/live/0085_preflight.sql part1
      - name: 0085 postcheck, read only (m85_postcheck)
        if: inputs.action == 'm85_postcheck'
        run: bash .github/scripts/run-check.sh "$DB" supabase/live/0085_postcheck.sql all
      - name: What occupies the old smoke/API test slots, read only (test_conflicts)
        if: inputs.action == 'test_conflicts'
        run: psql "$DB" -v ON_ERROR_STOP=1 -c "set default_transaction_read_only = on" -f supabase/live/test_conflicts.sql
      - name: launch-1 postcheck, read only (launch1_postcheck)
        if: inputs.action == 'launch1_postcheck'
        run: bash .github/scripts/run-check.sh "$DB" supabase/live/launch1_postcheck.sql all
      - name: 0078 preflight, read only (m7_0078_preflight)
        if: inputs.action == 'm7_0078_preflight'
        run: psql "$DB" -v ON_ERROR_STOP=1 -c "set default_transaction_read_only = on" -f supabase/live/0078_preflight.sql
      - name: 0078 postcheck, read only (m7_0078_postcheck)
        if: inputs.action == 'm7_0078_postcheck'
        run: |
          if [ "$(psql "$DB" -At -c "select count(*) from staging_meta.applied where name like '0084_%'")" != 0 ]; then
            echo "::error::0084 is applied: the 0078 postcheck pins a function 0084 replaces. Use launch1_postcheck."; exit 1
          fi
          bash .github/scripts/run-check.sh "$DB" supabase/live/0078_postcheck.sql all
      - name: Hide demo clubs on staging (m7_demo_hidden_on)
        if: inputs.action == 'm7_demo_hidden_on'
        run: |
          bash .github/scripts/demo-switch.sh "$DB" on
      - name: Show demo clubs on staging again (m7_demo_hidden_off)
        if: inputs.action == 'm7_demo_hidden_off'
        run: |
          bash .github/scripts/demo-switch.sh "$DB" off
      - name: Block rules as a desk account, rolled back (blocks_functional)
        if: inputs.action == 'blocks_functional'
        run: |
          # show psql's output even when it stops on an error (a failed statement ends the transaction: nothing is kept)
          rc=0; out=$(psql "$DB" -v ON_ERROR_STOP=1 -f supabase/staging/blocks_functional.sql 2>&1) || rc=$?
          echo "$out" | sed 's/^psql:[^ ]* NOTICE:  //'
          echo "$out" | grep -q "RESULT: 0 failure(s)" && [ "$rc" = 0 ] || { echo "::error::block checks failed (psql exit $rc)"; exit 1; }

      - name: Booking-protection checks on staging
        if: inputs.action == 'smoke'
        run: bash supabase/tests/staging_smoke.sh

      - name: Cancellation and refunds (cancel)
        if: inputs.action == 'cancel'
        run: bash supabase/tests/staging_cancel.sh

      - name: Report
        if: always()
        run: |
          psql "$DB" -At -F ' ' <<'SQL'
          select 'migrations applied:', count(*), coalesce(min(name), '-'), '…', coalesce(max(name), 'none') from staging_meta.applied;
          select 'hold_slot signatures:', count(*) from pg_proc where proname = 'hold_slot' and pronamespace = 'public'::regnamespace;
          select 'hold_slot args:', pg_get_function_identity_arguments(oid) from pg_proc where proname = 'hold_slot' and pronamespace = 'public'::regnamespace;
          select 'public functions:', count(*) from pg_proc where pronamespace = 'public'::regnamespace;
          select 'RLS policies:', count(*) from pg_policies where schemaname = 'public';
          select 'booking exclusion constraint present:', count(*) > 0 from pg_constraint where conrelid = to_regclass('public.bookings') and contype = 'x';
          select 'demo clubs:', string_agg(name || ' (' || payment_mode || ')', ', ') from public.clubs where is_demo;
          SQL
          # the live preflight, run read-only here too (staging has 0065: only the hold_slot rows may differ)
          psql "$DB" -f supabase/live/0065_preflight_v2.sql || true
          # the 0066 post-check, read only (staging has 0066: every row should be true)
          psql "$DB" -f supabase/live/0066_postcheck.sql || true
          # per kind of object: count and hash (the same query can be run read-only on live)
          psql "$DB" -f supabase/tests/schema_fingerprint_summary.sql || true
          # one line per schema object with a hash of its definition, to compare with a local build
          psql "$DB" -At -f supabase/tests/schema_fingerprint.sql || true
