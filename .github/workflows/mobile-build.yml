name: Mobile build (Expo)

# Run by hand from the Actions tab. Nothing about the Next.js app is touched.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app: live (CourtBook, live database) or staging (CourtBook Staging, staging database)"
        type: choice
        options: ["live", "staging"]
        default: "live"
      platform:
        description: "Which platform to build"
        type: choice
        options: ["android", "ios"]
        default: "android"

jobs:
  build:
    name: EAS build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      # Checkout runs first: every later step runs inside mobile/, which does
      # not exist until the repository is on disk.
      - uses: actions/checkout@v4

      - name: Fail early if the Expo token is missing
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # `eas` comes from expo/expo-github-action above, which installs the
      # eas-cli package globally and puts it on the PATH. It is called bare,
      # never through npx: the package is named eas-cli, so `npx eas` looks for
      # a package called `eas`, finds none, and fails with "could not determine
      # executable to run". This step makes that failure obvious here rather
      # than three steps later.
      - name: Check the EAS CLI is on the PATH
        run: eas --version

      - name: Install dependencies
        run: npm ci

      # Sets EAS_ENV, CHANNEL, PROFILE (and APP_VARIANT for staging) and refuses to continue unless
      # the database this build will use is the right one for this app.
      - name: Which app, and is it wired to the right database
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}
        run: bash ../.github/scripts/eas-app-env.sh "${{ inputs.app }}"

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci

      - name: Release bundling, as EAS runs it (before spending a build)
        run: npm run check:bundle

      # No linking step: app.json carries owner and extra.eas.projectId, so the
      # build targets that one project. The previous `eas init --force` is gone
      # deliberately — it was only ever needed to create the project, and a
      # workflow that can create projects can create the wrong one.

      - name: Build
        run: |
          eas build \
            --platform ${{ inputs.platform }} \
            --profile "$PROFILE" \
            --non-interactive \
            --wait

      - name: Where to get the build
        run: |
          echo "Open expo.dev, go to the courtbook project, then Builds."
          echo "The newest build has an install page with a QR code."
