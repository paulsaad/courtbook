name: Mobile build (Expo)

# Run by hand from the Actions tab. Nothing about the Next.js app is touched.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which platform to build"
        type: choice
        options: ["android", "ios"]
        default: "android"
      profile:
        description: "eas.json build profile"
        type: choice
        options: ["preview", "development"]
        default: "preview"
      init_only:
        description: "Create the Expo project and stop, without building"
        type: boolean
        default: false

jobs:
  build:
    name: EAS build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      # Checkout runs first: every later step runs inside mobile/, which does
      # not exist until the repository is on disk.
      - uses: actions/checkout@v4

      - name: Fail early if the Expo token is missing
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # `eas` comes from expo/expo-github-action above, which installs the
      # eas-cli package globally and puts it on the PATH. It is called bare,
      # never through npx: the package is named eas-cli, so `npx eas` looks for
      # a package called `eas`, finds none, and fails with "could not determine
      # executable to run". This step makes that failure obvious here rather
      # than three steps later.
      - name: Check the EAS CLI is on the PATH
        run: eas --version

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # The project id is not committed, so each run links this checkout to the
      # EAS project that matches the slug in app.json under the token's account.
      # It creates that project the first time and reuses it afterwards.
      - name: Link the EAS project
        run: eas init --non-interactive --force

      # Run once with init_only before setting the Supabase values on expo.dev:
      # the project has to exist before it has an environment to set them in,
      # and a build made without them would install but not reach the database.
      - name: Stop here (init only)
        if: ${{ inputs.init_only }}
        run: |
          echo "Expo project created or linked."
          echo "Next: on expo.dev open the courtbook project > Environment variables,"
          echo "add EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY to the"
          echo "'preview' environment, then run this workflow again with init_only off."

      - name: Build
        if: ${{ !inputs.init_only }}
        run: |
          eas build \
            --platform ${{ inputs.platform }} \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            --wait

      - name: Where to get the build
        if: ${{ !inputs.init_only }}
        run: |
          echo "Open expo.dev, go to the courtbook project, then Builds."
          echo "The newest build has an install page with a QR code."
