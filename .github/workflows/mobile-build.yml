name: Mobile build (Expo)

# Run by hand from the Actions tab. Nothing about the Next.js app is touched.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Which platform to build"
        type: choice
        options: ["android", "ios"]
        default: "android"
      profile:
        description: "eas.json build profile"
        type: choice
        options: ["preview", "development"]
        default: "preview"

jobs:
  build:
    name: EAS build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      # Checkout runs first: every later step runs inside mobile/, which does
      # not exist until the repository is on disk.
      - uses: actions/checkout@v4

      - name: Fail early if the Expo token is missing
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # The project id is not committed, so each run links this checkout to the
      # EAS project that matches the slug in app.json under the token's account.
      # It creates that project the first time and reuses it afterwards.
      - name: Link the EAS project
        run: npx eas init --non-interactive --force

      - name: Build
        run: |
          npx eas build \
            --platform ${{ inputs.platform }} \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            --wait

      - name: Where to get the build
        if: always()
        run: |
          echo "Open expo.dev, go to the courtbook project, then Builds."
          echo "The newest build has an install page with a QR code."
