name: Mobile update (Expo)

# Sends new app code to phones that already have a build installed, without a new build.
# Run by hand from the Actions tab. "app" chooses the target: live → the "preview" channel (CourtBook
# on Paul's test phones, live database); staging → the "staging" channel (CourtBook Staging, staging
# database). "production" is first used in M5, only by republishing an update tested on preview.
#
#   publish                 checks, then publishes the current code as a new update
#   rollback-to-previous    re-publishes an earlier update (paste its group ID from the run summary)
#   rollback-to-built-in    tells phones to run the code that was inside their installed build
#
# After any of these, the phone needs two launches: the first downloads, the second runs it.
# Profile -> About shows which update is running.
#
# Which code it sends: the branch chosen in "Use workflow from". GitHub only lists a hand-run
# workflow if this file also exists on main, so a copy lives there; when run from mobile-m1 it is
# mobile-m1's copy and mobile-m1's app that are used. Run from a branch whose app has no update
# configuration (main, until M1 is merged), it stops at the first step and publishes nothing.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do"
        type: choice
        options: ["publish", "rollback-to-previous", "rollback-to-built-in"]
        default: "publish"
      app:
        description: "Which app: live (CourtBook, channel preview) or staging (CourtBook Staging, channel staging)"
        type: choice
        options: ["live", "staging"]
        default: "live"
      platform:
        description: "Which phones"
        type: choice
        options: ["ios", "android", "all"]
        default: "ios"
      group:
        description: "rollback-to-previous only: the update group ID to bring back"
        type: string
        required: false
      message:
        description: "Short note shown in the update list (optional)"
        type: string
        required: false

concurrency:
  group: mobile-update-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      PLATFORM: ${{ inputs.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse on a branch whose app is not set up for updates
        run: |
          url=$(jq -r '.expo.updates.url // empty' app.json)
          policy=$(jq -r '.expo.runtimeVersion.policy // .expo.runtimeVersion // empty' app.json)
          if [ -z "$url" ] || [ -z "$policy" ]; then
            echo "::error::Branch '${GITHUB_REF_NAME}' has no EAS Update setup in mobile/app.json. Choose mobile-m1 under 'Use workflow from'."
            exit 1
          fi
          echo "Branch ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7} · app version $(jq -r .expo.version app.json) · runtime policy $policy"

      - name: Fail early if the Expo token is missing
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "EXPO_TOKEN is not set."; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # Sets EAS_ENV and CHANNEL (and APP_VARIANT for staging); stops unless the database the update
      # will use is the right one for this app. The app itself refuses a mismatch too (lib/variant.ts).
      - name: Which app, and is it wired to the right database
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_ANON_KEY: ${{ secrets.STAGING_ANON_KEY }}
        run: bash ../.github/scripts/eas-app-env.sh "${{ inputs.app }}"

      - name: Checks (publish only)
        if: inputs.action == 'publish'
        run: |
          npm run typecheck
          npm test -- --ci

      # The runtime version is the app's "version" in app.json. An update only reaches builds with
      # the same runtime version, so it can never land on a build whose native code it was not made for.
      # This check closes the remaining gap: someone adding native code and forgetting to bump the
      # version. It refuses to publish unless a finished preview build exists whose native
      # fingerprint is identical to this code's.
      - name: Native fingerprint must match an installed build (publish only)
        if: inputs.action == 'publish'
        run: |
          platforms=$([ "$PLATFORM" = "all" ] && echo "ios android" || echo "$PLATFORM")
          for p in $platforms; do
            hash=$(npx expo-updates fingerprint:generate --platform "$p" | jq -r .hash)
            found=$(eas build:list --channel "$CHANNEL" --platform "$p" --status finished \
                      --fingerprint-hash "$hash" --limit 1 --json --non-interactive | jq length)
            echo "$p native fingerprint $hash: $found matching $CHANNEL build(s)"
            if [ "$found" = "0" ]; then
              echo "Latest finished $p $CHANNEL builds, for comparison:"
              eas build:list --channel "$CHANNEL" --platform "$p" --status finished --limit 3 --json --non-interactive > /tmp/builds.json || true
              jq -r '.[] | "  \(.createdAt) build \(.id) version \(.appVersion) runtime \(.runtimeVersion // .runtime.version // "?") fingerprint \(.fingerprintHash // .fingerprint.hash // "not recorded")"' /tmp/builds.json || true
              latest=$(jq -r '.[0].id // empty' /tmp/builds.json)
              if [ -n "$latest" ]; then
                echo "What differs between this code and build $latest (Expo's own comparison):"
                eas fingerprint:compare --build-id "$latest" --environment "$EAS_ENV" --json --non-interactive > /tmp/compare.raw 2>/tmp/compare.err || true
                # the command prints an environment notice before its JSON; keep the JSON only
                sed -n '/^{/,$p' /tmp/compare.raw > /tmp/compare.json
                python3 ../.github/scripts/fingerprint-diff.py /tmp/compare.json || head -c 3000 /tmp/compare.json
                tail -3 /tmp/compare.err
              fi
              echo "::error::No $p $CHANNEL build has this native code. Native code changed (or no build exists yet):"
              echo "::error::bump \"version\" in mobile/app.json, run the Mobile build workflow, then publish."
              exit 1
            fi
          done

      - name: Keep the fingerprint comparison (when the gate refused)
        if: failure() && inputs.action == 'publish'
        uses: actions/upload-artifact@v4
        with:
          name: fingerprint-compare
          path: /tmp/compare.json
          if-no-files-found: ignore

      - name: Publish
        if: inputs.action == 'publish'
        env:
          MESSAGE: ${{ inputs.message }}
        run: |
          msg="${MESSAGE:-$(git log -1 --pretty=%s)} [${GITHUB_REF_NAME}@${GITHUB_SHA::7}]"
          eas update --channel "$CHANNEL" --environment "$EAS_ENV" --platform "$PLATFORM" \
            --message "$msg" --non-interactive --json > /tmp/update.json
          echo "## Published to $CHANNEL" >> "$GITHUB_STEP_SUMMARY"
          echo "Message: $msg" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | "- \(.platform): update \(.id) · group \(.group) · runtime \(.runtimeVersion)"' /tmp/update.json >> "$GITHUB_STEP_SUMMARY" || true
          # The raw result always goes to the log, whatever its exact shape.
          cat /tmp/update.json

      - name: Roll back to an earlier update
        if: inputs.action == 'rollback-to-previous'
        env:
          GROUP: ${{ inputs.group }}
          MESSAGE: ${{ inputs.message }}
        run: |
          if [ -z "$GROUP" ]; then echo "::error::Paste the group ID of the update to bring back."; exit 1; fi
          eas update:republish --group "$GROUP" --platform "$PLATFORM" \
            --message "${MESSAGE:-Rollback to $GROUP}" --non-interactive --json > /tmp/update.json
          echo "## Rolled $CHANNEL back to group $GROUP" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | "- \(.platform): now update \(.id)"' /tmp/update.json >> "$GITHUB_STEP_SUMMARY" || true
          cat /tmp/update.json

      - name: Roll back to the built-in code
        if: inputs.action == 'rollback-to-built-in'
        env:
          MESSAGE: ${{ inputs.message }}
        run: |
          rv=$(npx expo-updates runtimeversion:resolve --platform ios | jq -r .runtimeVersion)
          eas update:roll-back-to-embedded --channel "$CHANNEL" --runtime-version "$rv" --platform "$PLATFORM" \
            --message "${MESSAGE:-Rollback to built-in code}" --non-interactive
          echo "## $CHANNEL rolled back to built-in code (runtime $rv)" >> "$GITHUB_STEP_SUMMARY"

      - name: Recent updates on this channel
        if: always()
        run: |
          echo "## Recent $CHANNEL updates (group IDs for rollback)" >> "$GITHUB_STEP_SUMMARY"
          eas update:list --branch "$CHANNEL" --limit 10 --json --non-interactive \
            | jq -r '.currentPage[]? | "- \(.createdAt) · group \(.group) · \(.message)"' >> "$GITHUB_STEP_SUMMARY" || true
